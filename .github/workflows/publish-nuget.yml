# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Publish NuGet package
on:
  workflow_dispatch: # Allow running the workflow manually from the GitHub UI

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NuGetDirectory: ${{ github.workspace}}/nuget

defaults:
  run:
    shell: pwsh

jobs:
  create_nuget:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0 # Get all history to allow automatic versioning using MinVer

    - name: Verify release tag
      run: |
        $tags = @(git tag --points-at HEAD | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' })
        if ($tags.Count -ne 1) {
          throw "The selected commit must have exactly one stable tag such as 'v6.0.10'."
        }
        "RELEASE_VERSION=$($tags[0].Substring(1))" | Out-File -FilePath $env:GITHUB_ENV -Append

    # Install the .NET SDK indicated in the global.json file
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
        dotnet-version: |
          9.0.x
          8.0.x

    # Create the NuGet package in the folder from the environment variable NuGetDirectory
    - run: dotnet pack --configuration Release --output ${{ env.NuGetDirectory }}

    - name: Verify NuGet package
      run: |
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $packages = @(Get-ChildItem "${{ env.NuGetDirectory }}" -File -Filter *.nupkg)
        if ($packages.Count -ne 1) { throw "Expected exactly one NuGet package, found $($packages.Count)." }
        $archive = [System.IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
        try {
          $entries = @($archive.Entries | Where-Object { $_.FullName -like '*.nuspec' })
          if ($entries.Count -ne 1) { throw "Expected exactly one nuspec in $($packages[0].Name)." }
          $reader = [System.IO.StreamReader]::new($entries[0].Open())
          try { [xml]$nuspec = $reader.ReadToEnd() } finally { $reader.Dispose() }
        } finally { $archive.Dispose() }
        if ($nuspec.package.metadata.id -ne 'VolocyNazad.Toolkit.Localization') { throw "Unexpected package id '$($nuspec.package.metadata.id)'." }
        if ($nuspec.package.metadata.version -ne $env:RELEASE_VERSION) { throw "Package version '$($nuspec.package.metadata.version)' does not match tag version '$env:RELEASE_VERSION'." }

    # Publish the NuGet package as an artifact, so they can be used in the following jobs
    - uses: actions/upload-artifact@v4
      with:
        name: nuget
        if-no-files-found: error
        retention-days: 7
        path: ${{ env.NuGetDirectory }}/*.nupkg

  run_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
        dotnet-version: |
          9.0.x
          8.0.x
    - name: Run tests
      run: dotnet test --project tests/Toolkit.Localization.Tests/Toolkit.Localization.Tests.csproj --configuration Release

  deploy:
    runs-on: ubuntu-latest
    needs: [ create_nuget, run_test ]
    steps:
      - uses: actions/checkout@v3
      # Download the NuGet package created in the previous job
      - uses: actions/download-artifact@v4
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}

      # Install the .NET SDK indicated in the global.json file
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: |
            9.0.x
            8.0.x

      # Publish all NuGet packages to NuGet.org
      # Use --skip-duplicate to prevent errors if a package with the same version already exists.
      # If you retry a failed workflow, already published packages will be skipped without error.
      - name: Publish NuGet package
        run: |
          $packages = @(Get-ChildItem "${{ env.NuGetDirectory }}" -Recurse -File -Filter *.nupkg)
          if ($packages.Count -ne 1) { throw "Expected exactly one validated NuGet package, found $($packages.Count)." }
          foreach($file in $packages) {
              dotnet nuget push $file --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
